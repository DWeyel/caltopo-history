name: Import v1.0 source

on:
  push:
    branches: [v1.0-staging]
    paths:
      - '.v1-import/**'
      - '.github/workflows/import-v1-source.yml'

permissions:
  contents: write

concurrency:
  group: import-v1-source
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and validate v1.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .v1-import/chunk-00 \
            .v1-import/chunk-01 \
            .v1-import/chunk-02 \
            .v1-import/chunk-03 \
            .v1-import/chunk-04 \
            .v1-import/chunk-05 \
            .v1-import/chunk-06 \
            .v1-import/chunk-07 \
            | base64 -d > /tmp/caltopo-history-v1.0.tar.xz

          echo "Reconstructed archive SHA256: $(sha256sum /tmp/caltopo-history-v1.0.tar.xz | awk '{print $1}')"
          xz -t /tmp/caltopo-history-v1.0.tar.xz
          tar -tJf /tmp/caltopo-history-v1.0.tar.xz >/dev/null

          rm -rf /tmp/caltopo-v1-check
          mkdir -p /tmp/caltopo-v1-check
          tar -xJf /tmp/caltopo-history-v1.0.tar.xz -C /tmp/caltopo-v1-check
          test "$(cd /tmp/caltopo-v1-check && python3 -c 'from app.version import APP_VERSION; print(APP_VERSION)')" = '1.0'
          test -f /tmp/caltopo-v1-check/CALTOPO-SERVICE-ACCOUNT.md
          test -f /tmp/caltopo-v1-check/RELEASE-NOTES-v1.0.md
          test -f /tmp/caltopo-v1-check/.github/workflows/test-and-license.yml
          test -f /tmp/caltopo-v1-check/.github/workflows/container-compliance.yml
          test -f /tmp/caltopo-v1-check/.github/workflows/release.yml

      - name: Replace legacy transport tree with normal v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .v1-import -exec rm -rf -- {} +
          tar -xJf /tmp/caltopo-history-v1.0.tar.xz -C .
          rm -rf .v1-import
          test "$(python3 -c 'from app.version import APP_VERSION; print(APP_VERSION)')" = '1.0'
          test ! -d support
          test ! -d app/_payload
          python3 -m compileall -q app

      - name: Commit v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare CalTopo History 1.0'
          git push origin HEAD:v1.0-staging
