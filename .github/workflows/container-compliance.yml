name: Container compliance

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose.https.yaml'
      - 'Caddyfile'
      - 'requirements.txt'
      - 'app/**'
      - 'docker/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/container-compliance.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose.https.yaml'
      - 'Caddyfile'
      - 'requirements.txt'
      - 'app/**'
      - 'docker/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/container-compliance.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-compliance:
    name: Build, SBOM and license scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_REF: caltopo-history:compliance-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build release-equivalent container image
        run: docker build --pull --tag "$IMAGE_REF" .

      - name: Create artifact directory
        run: mkdir -p compliance-artifacts

      - name: Generate SPDX JSON SBOM with Syft
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: compliance-artifacts/caltopo-history.spdx.json
          artifact-name: caltopo-history-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.73.0
          cache: true

      - name: Scan container licenses (JSON)
        run: |
          trivy image \
            --scanners license \
            --license-full \
            --format json \
            --output compliance-artifacts/trivy-license-report.json \
            "$IMAGE_REF"

      - name: Scan container licenses (human-readable)
        run: |
          trivy image \
            --scanners license \
            --license-full \
            --format table \
            --output compliance-artifacts/trivy-license-report.txt \
            "$IMAGE_REF"

      - name: Summarize container license scan
        if: always()
        run: |
          echo '## Container compliance' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Container image built from the current Dockerfile.' >> "$GITHUB_STEP_SUMMARY"
          echo '- SPDX JSON SBOM generated with Syft.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full container license scan generated with Trivy.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Review the uploaded Trivy report before publishing a binary image.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy license reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: caltopo-history-container-license-reports
          path: |
            compliance-artifacts/trivy-license-report.json
            compliance-artifacts/trivy-license-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish workflow status bridge
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_commit_status.py \
            --context caltopo/container-compliance \
            --description "Container build, SBOM and license scan" \
            --job-status "${{ job.status }}"
