name: Sync canonical AGPL license text

on:
  push:
    paths:
      - '.github/workflows/sync-license.yml'

permissions:
  contents: write

jobs:
  sync-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch canonical GNU AGPL v3 text
        run: curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://www.gnu.org/licenses/agpl-3.0.txt --output LICENSE
      - name: Commit canonical license when needed
        run: |
          if git diff --quiet -- LICENSE; then
            echo 'LICENSE already matches the canonical FSF text.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE
          git commit -m 'Sync canonical GNU AGPL v3 license text'
          git push
