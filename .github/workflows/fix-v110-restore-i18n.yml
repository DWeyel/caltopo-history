name: fix-v110-restore-i18n

on:
  push:
    branches: [v1.1.0-staging]
    paths:
      - scripts/fix_v110_restore_i18n.py
      - .github/workflows/fix-v110-restore-i18n.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.1.0-staging
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply translation cleanup
        run: python scripts/fix_v110_restore_i18n.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q app
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/i18n.py
          git commit -m 'Align German deleted-map recovery guidance'
          git push origin HEAD:v1.1.0-staging
