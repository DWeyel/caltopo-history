services:
  caltopo-history:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IMAGE_REF:-caltopo-history:1.0.1}"
    container_name: caltopo-history
    restart: unless-stopped
    environment:
      CALTOPO_CREDENTIAL_ID: "${CALTOPO_CREDENTIAL_ID:-}"
      CALTOPO_CREDENTIAL_SECRET: "${CALTOPO_CREDENTIAL_SECRET:-}"
      APP_USERNAME: "${APP_USERNAME:-admin}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      INITIAL_ADMIN_PASSWORD_FILE: "/data/.initial-admin-password"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
      APP_SECRET_KEY_FILE: "/data/.app-secret-key"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-60}"
      DISCOVERY_INTERVAL_SECONDS: "${DISCOVERY_INTERVAL_SECONDS:-300}"
      FULL_VERIFY_EVERY: "${FULL_VERIFY_EVERY:-30}"
      TZ: "${TZ:-Europe/Berlin}"
      DATABASE_URL: "sqlite:////data/caltopo-history.db"
      CALTOPO_BASE_URL: "${CALTOPO_BASE_URL:-https://caltopo.com}"
      SOURCE_CODE_URL: "${SOURCE_CODE_URL:-}"
      MAP_TILE_URL: "${MAP_TILE_URL:-}"
      MAP_TILE_ATTRIBUTION: "${MAP_TILE_ATTRIBUTION:-}"
      MAP_TILE_MAX_ZOOM: "${MAP_TILE_MAX_ZOOM:-}"
      APP_PORT: "8765"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${HOST_PORT:-8765}:8765"
    volumes:
      - "${DATA_VOLUME:-caltopo_history_data}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s

volumes:
  caltopo_history_data:
    name: "${DATA_VOLUME_NAME:-caltopo_history_data}"
